name: snapshot-odds

# Captures odds + the ESPN injury list on GitHub's infrastructure while the
# user (Europe-based) is asleep during the NBA overnight window. Files land
# in data/odds_snapshots/ and data/injury_snapshots/ and are committed back
# to main; the user's machine loads them with
# `python3 -m nba_betting import-snapshots --pull`.
#
# Why a long-running loop instead of many cron slots: GitHub's scheduler
# delivered ~6 of 33 slots per day, hours late (2026-09/10: no runs 09-15
# UTC, 55 runs 04-09 UTC when nothing was scheduled), so the last capture
# before a 7 PM ET tip was a median 97 min old. Now one run captures in a
# loop paced on the next tip-off (every 30 / 15 / 5 min) for up to 5.5 h,
# then dispatches its own successor — workflow_dispatch starts within
# seconds, unlike cron — so the chain covers a game day end to end. When
# nothing tips within 18 h (overnight, off days, offseason) the run stops
# without a successor and the hourly cron below restarts the chain (18 h,
# not 12, because GitHub delivers that cron only ~4x/day: a morning
# delivery must be able to start the loop for an evening slate). An
# external cron-job.org job also dispatches this workflow at 09:15 and
# 18:15 UTC (USAGE.md "External daily trigger"), so the restart doesn't
# depend on GitHub's scheduler. Triggers that arrive while a run is active
# wait as "pending" and are cancelled when the successor is queued.
# Logic: nba_betting/data/snapshot_loop.py.
#
# GitHub disables scheduled workflows after 60 days without repo activity.
# The injury list changes almost daily, so commits keep the repo active;
# if it ever is disabled, re-enable it in the Actions tab.

on:
  schedule:
    # Restarts the chain (e.g. the morning after an idle stop). Offset from
    # :00 because GitHub's scheduler is most congested at the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (ignored; purely for audit)."
        required: false
        default: "manual"

permissions:
  contents: write   # commit snapshot files back to main
  actions: write    # dispatch the successor run

concurrency:
  # One run at a time: never two loops appending to the same files.
  group: snapshot-odds
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # GitHub's hard limit is 360. The loop stops itself at --budget-minutes
    # and leaves time for the final push + successor dispatch.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Without `ref`, a scheduled run checks out the commit that was
          # main when it was *triggered*; a run queued for hours (2026-09-13)
          # then starts from a stale tree and its push conflicts.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot loop
        id: loop
        env:
          PYTHONUNBUFFERED: "1"
        # --skip-nba-api: stats.nba.com never answers GitHub's IPs; waiting
        # out its timeouts cost ~4.6 min per capture.
        run: |
          python -m nba_betting snapshot-loop \
            --budget-minutes 330 \
            --skip-nba-api \
            --commit-cmd "bash .github/scripts/commit-snapshots.sh"

      - name: Dispatch successor
        # Only after a budget stop (games still ahead). `always()` keeps the
        # chain going even if the loop step exits non-zero after deciding.
        if: always() && steps.loop.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot-odds.yml --ref main -f note=chain
